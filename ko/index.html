const q=new URLSearchParams(location.search);const seg=location.pathname.split('/').filter(Boolean)[0]||'';let L=q.get('lang')||(/^[a-z]{2,3}$/.test(seg)?seg:'en');const startPage=Math.max(1,Math.min(18,parseInt(q.get('p')||'1',10)||1));
const book=document.getElementById('book');let trk=null,B,secs=[],cur=0,reading=false,run=0,audio=null;
fetch('/assets/book.json?v='+(typeof VER!=='undefined'?VER:'1')).then(r=>r.json()).then(b=>{B=b;if(!B.book[L])L='en';if(B.book[L].ready===false){location.replace('/languages.html');return}const x=B.book[L];
  document.documentElement.lang=L;document.title=x.title+' · The Way Back Home';
  const U=L.toUpperCase();
  const mv=document.getElementById('mVideo');if(RECORDED[L]){mv.href='/video/The-Way-Back-Home_'+U+'.mp4';mv.setAttribute('download','The-Way-Back-Home_'+U+'.mp4')}else{mv.classList.add('off');mv.removeAttribute('href')}
  const T=LABELS[L]||LABELS.en;document.querySelectorAll('#menu [data-k]').forEach(e=>e.textContent=T[e.dataset.k]);
  if(x.rtl)document.getElementById('menu').setAttribute('dir','rtl');buildMsg();
  const BG=['#2F7FD9','#2E7D4F','#2E7D4F','#2E7D4F','#6B3F8C','#6B3F8C','#2A2340','#2A2340','#2A2340','#C8641E','#C8641E','#C8641E','#C8641E','#2F7FD9','#2F7FD9','#2F7FD9','#C8641E','#2E7D4F'];
  book.innerHTML='<div class="track" id="track">'+Array.from({length:18},(_,i)=>`<section style="--bg:${BG[i]}"><picture><source type="image/webp" sizes="(min-height:900px) 1080px, 720px" srcset="pages/${L}/${String(i+1).padStart(2,'0')}-720.webp?v=${VER} 720w, pages/${L}/${String(i+1).padStart(2,'0')}.webp?v=${VER} 1080w"><img src="pages/${L}/${String(i+1).padStart(2,'0')}.jpg?v=${VER}" alt="Page ${i+1}" draggable="false" decoding="async" ${i>1?'loading="lazy"':''}></picture></section>`).join('')+'</div>';
  trk=document.getElementById('track');secs=[...trk.children];setCount();const ci=secs[0].querySelector('img');ci.complete?placeLangHot():ci.addEventListener('load',placeLangHot);buildScenes();secs.forEach(s=>{const im=s.querySelector('img');im.addEventListener('load',placeScenes)});
  goTo(startPage-1,false);
  if(RECORDED[L])document.getElementById('read').hidden=false;
});

const menu=document.getElementById('menu'),mb=document.getElementById('menuBtn');
function openMenu(o){menu.hidden=!o;mb.setAttribute('aria-expanded',o)}
mb.onclick=e=>{e.stopPropagation();openMenu(menu.hidden);prefetchVideo()};
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target))openMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(false)});
menu.addEventListener('click',e=>{if(e.target.closest('a'))setTimeout(()=>openMenu(false),150)});

// ---- video: save to device (Photos/Files) instead of opening a player ----
let vidFile=null,vidFetching=false;
function prefetchVideo(){if(vidFile||vidFetching||!RECORDED[L]||!navigator.canShare)return;vidFetching=true;const U=L.toUpperCase();
  fetch('/video/The-Way-Back-Home_'+U+'.mp4').then(r=>r.blob()).then(b=>{const f=new File([b],'The-Way-Back-Home_'+U+'.mp4',{type:'video/mp4'});if(navigator.canShare({files:[f]}))vidFile=f}).catch(()=>{}).finally(()=>{vidFetching=false})}
function trackDl(){try{const back=location.pathname;history.pushState(null,'','/dl/'+L+'-video');history.replaceState(null,'',back)}catch(e){}}
document.getElementById('mVideo').addEventListener('click',async e=>{if(!RECORDED[L]){e.preventDefault();return}trackDl();

  const show=()=>{v.style.opacity=1};if(v.readyState>=2)show();else v.addEventListener('loadeddata',show,{once:true});
  try{v.currentTime=0}catch(e){}
  const fail=()=>{const last=()=>{try{v.currentTime=Math.max(0,v.duration-0.05)}catch(e){}show()};
    if(v.readyState>=1)last();else v.addEventListener('loadedmetadata',last,{once:true});onEnd&&onEnd()};
  v.play().then(show).catch(()=>{v.addEventListener('canplay',()=>{v.play().then(show).catch(fail)},{once:true});if(v.readyState>=3)v.play().then(show).catch(fail)})}
function startClip(i,j){const v=sceneVids(i)[j];if(v)runClip(v)}
function playBuf(url,onEnd){return loadBuf(url).then(buf=>{const src=actx.createBufferSource();src.buffer=buf;src.connect(narrBus);const t0=actx.currentTime+0.05;src.start(t0);src.onended=onEnd;return {src,t0,dur:buf.duration}})}
function playScene(i,j,withSound){return runSyncedClip(i,j,{sound:!!withSound})}
let scenePhase=false,autoTimer=null,prevCur=0;
function preloadNear(){[cur,cur+1].forEach(i=>sceneVids(i).forEach(v=>{if(!v.src&&v.dataset.src){v.preload='auto';v.src=v.dataset.src}}));[cur+1,cur+2].forEach(i=>{const im=secs[i]&&secs[i].querySelector('img');if(im&&im.loading==='lazy')im.loading='eager'})}
function pageChanged(){if(prevCur!==cur){resetScenes(prevCur);prevCur=cur}clearTimeout(autoTimer);preloadNear()}
function autoPlay(i){if(reading||i!==cur||!SCENES[i])return;const v0=sceneVids(i)[0];if(!v0||v0.dataset.done)return;
  const snd=!!(navigator.userActivation&&navigator.userActivation.hasBeenActive);
  (async()=>{for(let j=0;j<SCENES[i].length;j++){if(cur!==i||reading)return;await playScene(i,j,snd)}})()}

// ---- page turning: one swipe = one page, eased settle ----
let animating=false,settleT=null;
function H(){return book.clientHeight}
function setY(y,anim){trk.classList.toggle('anim',!!anim);trk.style.transform=`translate3d(0,${y}px,0)`}
function goTo(n,anim=true){if(!trk)return;n=Math.max(0,Math.min(17,n));const changed=n!==cur;cur=n;
  setY(-n*H(),anim);if(changed||!anim){setCount();pageChanged();if(reading){speak();setMood(MOOD[cur])}}
  clearTimeout(settleT);animating=anim;settleT=setTimeout(()=>{animating=false;autoPlay(cur);placeScenes();placeLangHot()},anim?520:60)}
let ty=null,tt=0,dy=0,moved=false;
book.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;ty=e.touches[0].clientY;tt=performance.now();dy=0;moved=false;trk.classList.remove('anim')},{passive:true});
book.addEventListener('touchmove',e=>{if(ty===null)return;dy=e.touches[0].clientY-ty;if(Math.abs(dy)>6)moved=true;
  let d=dy;if((cur===0&&d>0)||(cur===17&&d<0))d*=.3;setY(-cur*H()+d,false);e.preventDefault()},{passive:false});
book.addEventListener('touchend',()=>{if(ty===null)return;const v=dy/Math.max(1,performance.now()-tt);ty=null;
  if(!moved){setY(-cur*H(),false);return}
  if(dy<-H()*.12||v<-.35)goTo(cur+1);else if(dy>H()*.12||v>.35)goTo(cur-1);else goTo(cur)});
book.addEventListener('touchcancel',()=>{ty=null;goTo(cur)});
let wheelAcc=0,wheelLock=0;
book.addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(now<wheelLock)return;wheelAcc+=e.deltaY;
  if(Math.abs(wheelAcc)>40){goTo(cur+(wheelAcc>0?1:-1));wheelAcc=0;wheelLock=now+650}},{passive:false});
addEventListener('resize',()=>{if(trk)setY(-cur*H(),false)});

// ---- background score: one continuous mood per story section, crossfaded, dipping under the narrator ----
const MOOD=['c1','c1','c1','c2','c3','c3','c4','c4','c5','c6','c6','c6','c7','c7','c7','c7','c8','c8'];
const LOOP_START=1.0,LOOP_LEN=53.3333,MUSIC_UP=0.6,MUSIC_DUCK=0.3,XFADE=4;
let actx=null,mBus=null,mPlaying=null,mBufs={},mLoading={};
function ensureAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;actx=new C();mBus=actx.createGain();mBus.gain.value=0;mBus.gain._lvl=0;mBus.connect(actx.destination);narrBus=actx.createGain();narrBus.connect(actx.destination);actx.onstatechange=()=>{if(reading&&actx.state!=='running'){try{actx.resume()}catch(e){}}};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&reading&&actx.state!=='running'){try{actx.resume()}catch(e){}}})}if(actx.state!=='running')actx.resume()}catch(e){}}
function loadMood(n){if(mBufs[n])return Promise.resolve(mBufs[n]);if(mLoading[n])return mLoading[n];
  mLoading[n]=fetch('music/cue_'+n+'.mp3?v='+VER).then(r=>r.arrayBuffer()).then(ab=>new Promise((res,rej)=>actx.decodeAudioData(ab,res,rej))).then(b=>(mBufs[n]=b));return mLoading[n]}
async function setMood(n){if(!actx||(mPlaying&&mPlaying.name===n))return;let buf;try{buf=await loadMood(n)}catch(e){return}
  if(!reading||MOOD[cur]!==n||(mPlaying&&mPlaying.name===n))return;
  const now=actx.currentTime,src=actx.createBufferSource(),g=actx.createGain();src.buffer=buf;src.loop=true;src.loopStart=0;src.loopEnd=buf.duration;
  g.gain.setValueAtTime(0,now);g.gain._lvl=0;glide(g.gain,1,XFADE);src.connect(g);g.connect(mBus);src.start(now,0);
  if(mPlaying){const o=mPlaying;glide(o.g.gain,0,XFADE);try{o.src.stop(now+XFADE*1.6)}catch(e){}}
  mPlaying={name:n,src,g};const nx=MOOD[Math.min(17,cur+3)];if(nx)loadMood(nx).catch(()=>{})}
// glide a gain smoothly from wherever it is right now (iPad Safari reports stale .value during fades, which made the music drop out)
function glide(p,to,secs){const now=actx.currentTime;if(p.cancelAndHoldAtTime){p.cancelAndHoldAtTime(now)}else{p.cancelScheduledValues(now);p.setValueAtTime(p._lvl!=null?p._lvl:p.value,now)}p.setTargetAtTime(to,now,Math.max(0.05,secs/3));p._lvl=to}
function musicLevel(x,secs=0.8){if(!mBus)return;glide(mBus.gain,x,secs)}
function musicStop(){musicLevel(0,1.5);const p=mPlaying;mPlaying=null;if(p)setTimeout(()=>{try{p.src.stop()}catch(e){}},1700)}
function setCount(){const c_=document.getElementById('count');c_.textContent=(cur+1)+' / 18';c_.classList.toggle('hide',cur===0);if(secs.length&&B)track()}
function advance(me){setTimeout(()=>{if(reading&&cur===me){if(cur<17)goTo(cur+1);else setRead(false)}},1500)}
const synth=window.speechSynthesis;
const MALE=/(aaron|arthur|daniel|evan|nathan|tom|reed|alex|gordon|oliver|rishi|guy|andrew|brian|christopher|eric|davis|ryan|thomas|william|male|jorge|diego|thomas|yuri|maged|carmit|markus|felipe)/i,FEMALE=/(female|samantha|karen|moira|tessa|fiona|victoria|zira|aria|jenny|emma|ava|allison|susan|serena|kate|libby|sonia|zoe|monica|paulina|amelie|anna|milena|luciana|lekha|tingting|meijia)/i;
function pick(){const lang=B.book[L].voice.toLowerCase();const vs=synth.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(lang.split('-')[0]));
  const sc=v=>(MALE.test(v.name)?10:0)-(FEMALE.test(v.name)?20:0)+(/premium/i.test(v.name)?6:0)+(/enhanced|natural|neural|online/i.test(v.name)?5:0)+(v.lang.toLowerCase().replace('_','-')===lang?2:0);
  return vs.sort((a,b)=>sc(b)-sc(a))[0]}
function speak(){
  const id=++run,me=cur;player.pause();stopNarr();synth&&synth.cancel();
  clearTimeout(autoTimer);
  if(RECORDED[L]){ensureAudio();resetScenes(me);const NN=String(me+1).padStart(2,'0'),ext=RECORDED[L],scs=SCENES[me]||[];
    const live=()=>id===run&&reading&&cur===me;
    const startNarr=(url,onEnd)=>playBuf(`${url}?v=${VER}`,e=>{if(id===run&&narr&&narr.src===e.target){narr=null;onEnd&&onEnd()}}).then(n=>{
      if(!live()){try{n.src.onended=null;n.src.stop()}catch(e){}return null}narr=Object.assign(n,{id});musicLevel(MUSIC_DUCK,0.6);if(!mPlaying)setMood(MOOD[cur]);return n});
    const finish=()=>{musicLevel(MUSIC_UP,1.2);advance(me)};
    const P=PAUSE[me]&&scs[0]&&scs[0].at&&scs[0].at[L]!=null?PAUSE[me]:null;
    if(P){ // narration part 1 → clip with its own sound → narration part 2 (waits for the clip)
      let part2=false;const goPart2=()=>{if(part2||!live())return;part2=true;startNarr(`audio/${L}/${NN}-2.${ext}`,finish).then(n=>{if(!n&&live())finish()}).catch(()=>{if(id===run)advance(me)})};
      loadBuf(`audio/${L}/${NN}-2.${ext}?v=${VER}`).catch(()=>{});
      startNarr(`audio/${L}/${NN}-1.${ext}`,null).then(n=>{if(!n)return;const at=Math.max(0,n.dur-0.05-P.lead);let started=false;
        const tick=()=>{if(!live()||started)return;if(actx.currentTime-n.t0-outLat()>=at){started=true;runSyncedClip(me,0,{near:{rb:P.rb,fn:goPart2}}).then(goPart2)}else setTimeout(tick,30)};tick();
        if(me<17)loadBuf(narrUrl(me+1)).catch(()=>{})}).catch(()=>{if(id===run)advance(me)});
      return}
    // narration plays straight through; each clip starts at its cue and carries its own synced sound
    startNarr(`audio/${L}/${NN}.${ext}`,finish).then(n=>{if(!n)return;
      const cues=scs.map((s,j)=>({j,t:s.at&&s.at[L]})).filter(c=>c.t!=null);let ci=0;
      const tick=()=>{if(!live()||!narr||narr.id!==id)return;const pos=actx.currentTime-n.t0-outLat();while(ci<cues.length&&pos>=cues[ci].t){runSyncedClip(me,cues[ci].j);ci++}if(ci<cues.length)setTimeout(tick,30)};tick();
      if(me<17)loadBuf(narrUrl(me+1)).catch(()=>{})}).catch(()=>{if(id===run)advance(me)});return}
  const txt=(B.book[L].say||[])[cur]||'';const parts=txt.match(/[^.!?。！？।۔]+[.!?。！？।۔]+[”"’»“]?/g)||(txt?[txt]:[]);let k=0;const v=pick();
  resetScenes(me);const tcues=(SCENES[me]||[]).map((s,j)=>({j,n:s.sent}));let tc=0;
  const next=()=>{if(id!==run||!reading||cur!==me)return;if(tc<tcues.length&&k===tcues[tc].n){const c=tcues[tc++];playScene(me,c.j,true).then(()=>setTimeout(next,300));return}if(k>=parts.length){advance(me);return}
    const u=new SpeechSynthesisUtterance(parts[k++].trim());if(v){u.voice=v;u.lang=v.lang}else u.lang=B.book[L].voice;u.rate=.82;u.pitch=.9;u.onend=()=>setTimeout(next,600);synth.speak(u)};
  next();
}
function setRead(on){reading=on;if(on){ensureAudio()}else musicStop();const b=document.getElementById('read');b.setAttribute('aria-pressed',on);b.innerHTML=on?`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>`:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;b.setAttribute('aria-label',on?'Stop reading':'Read to me');if(on)speak();else{run++;stopNarr();synth&&synth.cancel();player.pause()}}
document.getElementById('read').onclick=()=>setRead(!reading);
addEventListener('keydown',e=>{if(!secs.length)return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();goTo(cur+1)}if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();goTo(cur-1)}});
